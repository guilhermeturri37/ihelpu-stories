name: Story do marketplace

on:
  # Sem 'schedule' de proposito: o cron do GitHub disparava com ate 4h de
  # atraso, o que faria um story marcado para 9h sair no meio da tarde.
  # Quem pede as rodadas (9h05, 10h05, 11h05, 12h05 e 13h05; so 9h, 11h e 13h
  # publicam, as outras o publicar.py ignora — 3/dia, pedido do Guilherme em 02/10/2026): o launchd
  # com.ihelpu.stories de outra maquina e, quando ativado, o n8n "Stories
  # Marketplace — Disparador". Pedido em dobro na mesma hora nao duplica:
  # o publicar.py publica um story por horario.
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Publicar agora, ignorando janela de horario e meta diaria'
        type: boolean
        default: false
      horario:
        description: 'Repor um horario de HOJE que ja passou (9, 11 ou 13). So vale com forcar; nao repoe o mesmo horario duas vezes'
        type: string
        default: ''

# Evita que duas execucoes empurrem commits ao mesmo tempo.
concurrency:
  group: story
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # o script commita a arte e o registro
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que o Chrome existe no runner
        run: google-chrome --version

      - name: Identidade do git
        run: |
          git config user.name "Story Bot"
          git config user.email "guilherme@ihelpu.com.br"

      - name: Publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          IG_USER_ID: '17841400093603178'
          FORCAR: ${{ inputs.forcar && '1' || '0' }}
          HORARIO: ${{ inputs.horario }}
        run: python3 publicar.py
